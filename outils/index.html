}

.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button { font: inherit; font-weight: 600; border-radius: 6px; padding: 7px 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }

button.ghost:hover { color: var(--crit); }

.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: calc(100vh - 70px); }
nav.side { border-right: 1px solid var(--line); background: var(--surface); padding: 16px 10px 40px max(10px, env(safe-area-inset-left, 0px)); }

main { padding: 22px max(16px, env(safe-area-inset-right, 0px)) 60px 22px; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-content: start; }

table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }

.confirm { display: inline-flex; gap: 6px; align-items: center; }
@media (max-width: 820px) {

  .navsel { display: block; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
  .navsel select { width: 100%; padding: 8px; }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .step { grid-template-columns: 1fr; }
}
</style>

    var banner = msg ? '<div class="banner ' + (msg.cls || "") + '" role="status"><span>' + esc(msg.text) + '</span><span class="actions">' + (msg.actions || []).map(function (a) { return '<button type="button" class="small ' + (a.primary ? "primary" : "") + '" data-msg="' + a.id + '">' + esc(a.label) + "</button>"; }).join("") + '<button type="button" class="small" data-msg="close">Fermer</button></span></div>' : "";
    var reset = ui.confirmReset ? '<span class="confirm"><span class="note">Effacer tes saisies et revenir à l\'exemple ?</span><button type="button" class="small primary" data-act="reset-yes">Oui, réinitialiser</button><button type="button" class="small" data-act="reset-no">Annuler</button></span>' : '<button type="button" class="small" data-act="reset">Réinitialiser l\'exemple</button>';
    app.innerHTML = '<header class="top"><div class="in"><div><div class="eyebrow">Projet PACS · ' + esc(S.meta.client) + '</div><h1>Boîte à outils PACS</h1></div><div class="actions"><span class="chip" id="dirty"' + (dirty ? "" : " hidden") + '>Modifications enregistrées dans ce navigateur</span>' + wbHead() + share + '<button type="button" class="small" data-act="copy-data">Copier les données</button>' + reset + "</div></div></header>" + sel +
      '<div class="layout"><nav class="side" aria-label="Outils">' + side + "</nav><main>" + banner + wbPanel() +
      (t.id !== "accueil" ? '<div class="toolhead"><div class="eyebrow">' + esc(t.g) + "</div><h2>" + esc(t.l) + "</h2><p>" + esc(t.d) + '</p><div style="margin-top:10px">' + exportButtons(t.id) + "</div></div>" : "") + V[t.id].main() + "</main></div>";
    refreshSum();
  }
  var COCKPIT_URL = "../";
  function wbHead() {
    return (ui.wb ? '<span class="chip wbchip" title="' + esc(ui.wb.name) + '">Classeur : ' + esc(ui.wb.name) + "</span>" + (ui.wb.hasOT ? '<button type="button" class="small primary" data-act="wb-save">Enregistrer dans le classeur</button>' : "") : "") +
            (COCKPIT_URL ? '<a class="btnlink small" href="' + esc(COCKPIT_URL) + '" target="_blank" rel="noopener">Cockpit du projet</a>' : "") + '<button type="button" class="small" data-act="wb-panel" aria-expanded="'  + (ui.wbPanel ? "true" : "false") + '">Classeur du projet</button>';
  }
  function wbPanel() {
    if (!ui.wbPanel) return "";
    var file = '<input type="file" id="wbfile" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>';
    var linkedNames = { "meta.projet": "nom du projet", "meta.client": "client", "meta.chefDeProjet": "chef de projet", "migration.debut": "dates de migration", "bascule.t0": "date de bascule", "avenant.caProjet": "chiffre d'affaires", "avenant.coutProjet": "coût prévu" };
    var body = ui.wb
      ? "<p>Classeur ouvert : <strong>" + esc(ui.wb.name) + "</strong>" + (ui.wb.hasOT ? ". Les outils lisent et écrivent ses onglets verts « OT … »." : ". Il n'a pas encore d'onglets « OT … » : seules les valeurs de pilotage ont été reprises. Crée un classeur au nouveau format pour y enregistrer les outils.") + "</p>" +
        (ui.wb.linked.length ? '<p class="note">Valeurs reprises du pilotage, en lecture seule ici : ' + Object.keys(linkedNames).filter(function (k) { return ui.wb.linked.indexOf(k) >= 0; }).map(function (k) { return linkedNames[k]; }).join(", ") + ". Elles se modifient dans les onglets Accueil, Budget et Planning du classeur.</p>" : "") +
        '<p class="note">Après « Enregistrer dans le classeur », le navigateur télécharge le classeur mis à jour : remplace l\'ancien fichier par celui-ci. Les onglets de pilotage, le tableau de bord et les documents ne sont pas modifiés.</p>' +
        '<div class="actions">' + (ui.wb.hasOT ? '<button type="button" class="primary small" data-act="wb-save">Enregistrer dans le classeur</button>' : '<button type="button" class="primary small" data-act="wb-new">Créer un classeur à partir de ces données</button>') + '<button type="button" class="small" data-act="wb-open">Ouvrir un autre classeur</button><button type="button" class="small" data-act="wb-close">Fermer le classeur</button></div>'
      : "<p>Chaque projet a son classeur Excel de pilotage PRINCE2 (version éditeur). Ses onglets verts « OT … » servent de base de données à la boîte à outils, et le tableau de bord du classeur en reprend les indicateurs. Le nom du projet, le client, le budget et les dates de migration et de bascule viennent directement des onglets de pilotage.</p>" +
        '<div class="actions"><button type="button" class="primary small" data-act="wb-open">Ouvrir le classeur du projet</button><button type="button" class="small" data-act="wb-new">Créer un classeur à partir de ces données</button></div>' +
        '<p class="note">Le fichier reste sur ton ordinateur : il est lu dans ce navigateur et n\'est envoyé nulle part.</p>';
    return '<section class="panel wbpanel" aria-label="Classeur du projet"><h3>Classeur du projet</h3>' + body + file + "</section>";
  }
  function wbOpenFile(f) {
    if (!f) return;
    msg = { text: "Lecture du classeur…" }; render();
    var buf;
    f.arrayBuffer().then(function (b) { buf = new Uint8Array(b); return needXLSX(); }).then(function () {
      var wb = XLSX.read(buf, { type: "array" }), res = otRead(wb);
      if (!res.hasOT && !res.pilot) throw { code: "not_pilot" };
      S = otMerge(S, res.data);
      ui.wb = { name: f.name, buf: buf, linked: res.linked, hasOT: res.hasOT };
      ui.wbPanel = res.hasOT ? false : true;
      saveDraft();
      var n = OTS.lists.length + 1 - res.missing.length;
      msg = { cls: "ok", text: res.hasOT ? "Classeur « " + f.name + " » ouvert : " + n + " onglets OT lus" + (res.missing.length ? " (absents : " + res.missing.join(", ") + ")" : "") + ", valeurs de pilotage reprises." : "Classeur « " + f.name + " » ouvert sans onglets OT : nom, client, budget et dates repris du pilotage." };
      render();
    }).catch(function (err) {
      msg = { cls: "err", text: err && err.code === "not_pilot" ? "Ce fichier n'est pas un classeur de pilotage PACS : il n'a ni onglets « OT … » ni onglets Accueil et Planning." : "Le classeur n'a pas pu être lu. Vérifie qu'il s'agit d'un fichier .xlsx non protégé par mot de passe." };
      render();
    });
  }
  function shortSlug(t) { var x = slug(t); if (x.length > 48) x = x.slice(0, 48).replace(/-[^-]*$/, ""); return x || "projet"; }
  function wbWrite(isNew) {
    var src = isNew ? b64bytes(OT_MODELE) : ui.wb.buf, name = isNew ? "Pilotage-PACS-" + shortSlug(String(S.meta.client || S.meta.projet || "projet").split("|")[0]) + ".xlsx" : ui.wb.name;
    msg = { text: isNew ? "Création du classeur…" : "Enregistrement dans le classeur…" }; render();
    otWrite(src, S, { meta: isNew }).then(function (r) {
      var blob = new Blob([r.bytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      return saveFile(name, blob).then(function () {
        var linked = isNew ? OTS.params.filter(function (p) { return p.link; }).map(function (p) { return p.k; }) : ui.wb.linked;
        ui.wb = { name: name, buf: r.bytes, linked: linked, hasOT: true }; ui.wbPanel = false;
        msg = { cls: "ok", text: isNew ? "Classeur « " + name + " » créé avec les données des outils. Complète ensuite ses onglets de pilotage (planning, budget, risques) dans Excel." : "Classeur enregistré : remplace l'ancien « " + name + " » par le fichier téléchargé." + (r.skipped.length ? " " + r.skipped.length + " valeurs liées au pilotage n'ont pas été touchées." : "") };
        render();
      });
    }).catch(function (err) {
      var c = err && err.code;
      msg = { cls: "err", text: c === "no_ot" ? "Ce classeur n'a pas les onglets « OT … » attendus (" + err.sheets.slice(0, 3).join(", ") + "…). Utilise « Créer un classeur à partir de ces données »." : c === "user_declined" || c === "declined" ? "Téléchargement annulé." : "L'enregistrement a échoué : " + ((err && err.message) || "erreur inconnue") + "." };
      render();
    });
  }
  function refreshSum() { var el = document.getElementById("sum"), v = V[view]; if (el && v && v.sum) el.innerHTML = v.sum(); }

  /* ================= événements ================= */
  function route() { var h = (location.hash || "").replace("#", ""); view = TOOLS.some(function (x) { return x.id === h; }) ? h : "accueil"; ui.confirmReset = false; render(); window.scrollTo(0, 0); }
  window.addEventListener("hashchange", route);
  function onEdit(e) {
    var el = e.target, p = el.dataset && el.dataset.p; if (!p) return;
    var v = el.dataset.chk ? el.checked : el.dataset.num ? (el.value === "" ? "" : Number(el.value) / (el.dataset.pct ? 100 : 1)) : el.value;
    if (p === "flux.systemesTxt") { S.flux.systemes = el.value.split(",").map(function (s) { return s.trim(); }).filter(Boolean); if (e.type === "change") { saveDraft(); render(); } return; }
    if (p === "formation.sitesTxt") {
      if (e.type !== "change") return;
      var ns = el.value.split(",").map(function (s) { return s.trim(); }).filter(Boolean), old = S.formation.sites;
      S.formation.profils.forEach(function (pr) { pr.effectifs = ns.map(function (s) { var i = old.indexOf(s); return i >= 0 ? pr.effectifs[i] : 0; }); });
      S.formation.sites = ns; saveDraft(); render(); return;
    }
    if (p.indexOf("aet.sites.") === 0) { S.aet.sites[p.slice(10)] = v; } else setP(S, p, v);
    if (el.tagName === "SELECT") el.setAttribute("data-v", el.value);
    saveDraft();
    if (e.type === "change" && /^(modalites\.rows\.\d+\.site|formation\.profils\.\d+\.profil)$/.test(p)) { render(); return; }
    refreshSum();
  }
  app.addEventListener("input", function (e) { if (e.target.dataset && (e.target.dataset.num || e.target.tagName === "TEXTAREA" || e.target.type === "text")) onEdit(e); });
  app.addEventListener("change", onEdit);
  app.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var d = b.dataset;
    if (d.add) { var arr = getP(S, d.add); arr.push(blankRow(d.add)); saveDraft(); render(); return; }
    if (d.del) { var ps = d.del.split("."), idx = +ps.pop(); getP(S, ps.join(".")).splice(idx, 1); saveDraft(); render(); return; }
    if (d.guide) { ui.guide = d.guide; render(); return; }
    if (d.exp) { runExport(d.exp, d.all ? EXPORT_ORDER : [view], d.var, b); return; }
    if (d.step !== undefined) { var st = S.bascule.etapes[+d.step]; st.statut = d.st; st.reel = d.st === "À faire" ? "" : nowLocal(); saveDraft(); refreshSum(); return; }
    if (d.msg) { if (d.msg === "close") { msg = null; render(); return; } if (d.msg === "keep") { msg = null; render(); return; } if (d.msg === "discard") { clearDraft(); S = clone(shared || DEFAULTS); msg = null; render(); return; } return; }
    var a = d.act; if (!a) return;
    if (a === "jourj") { ui.jourJ = !ui.jourJ; render(); return; }
    if (a === "paste-toggle") { ui.pasteOpen = !ui.pasteOpen; render(); return; }
    if (a === "paste-import") {
      var txt = (document.getElementById("paste") || {}).value || "", added = 0;
      txt.split(/\r?\n/).forEach(function (line) { if (!line.trim()) return; var f = line.split("\t"); var r = {}; MOD_COLS.forEach(function (c, i) { var v = (f[i] || "").trim(); r[c.k] = c.t === "num" ? (v ? Number(v.replace(",", ".")) : "") : v; }); if (STAT.wl.indexOf(r.worklist) < 0) r.worklist = "Oui"; if (STAT.modal.indexOf(r.statut) < 0) r.statut = "À connecter"; S.modalites.rows.push(r); added++; });
      ui.pasteOpen = false; saveDraft(); msg = { text: added + " modalité" + (added > 1 ? "s" : "") + " ajoutée" + (added > 1 ? "s" : "") + " à l'inventaire.", cls: "ok" }; render(); return;
    }
    if (a === "aet-apply") { var pr = aetPropose(); S.modalites.rows.forEach(function (r, i) { r.aet = pr[i]; }); saveDraft(); msg = { text: "AE Titles appliqués à l'inventaire. Pense à les communiquer au biomédical avant la reconfiguration des modalités.", cls: "ok" }; render(); return; }
    if (a === "aet-copy") { copyText(document.getElementById("aet-tsv").value, b); return; }
    if (a === "copy-pv") { copyText(document.getElementById("pv-text").textContent, b); return; }
    if (a === "copy-guide") { copyText(document.getElementById("guide").innerText, b); return; }
    if (a === "cr-gen") { ui.cr = parseCR(S.cr.notes, S.cr.date); refreshSum(); return; }
    if (a === "cr-copy") { copyText(document.getElementById("cr-text").textContent, b); return; }
    if (a === "cr-tsv") { copyText(document.getElementById("cr-tsv").value, b); return; }
    if (a === "av-copy") { copyText(document.getElementById("av-text").textContent, b); return; }
    if (a === "cr-ai") { aiCR(); return; }
    if (a === "copy-data") { copyText(JSON.stringify(S, null, 1), b); return; }
    if (a === "reset") { ui.confirmReset = true; render(); return; }
    if (a === "reset-no") { ui.confirmReset = false; render(); return; }
    if (a === "reset-yes") { clearDraft(); S = clone(shared || DEFAULTS); ui.confirmReset = false; msg = { text: "Données réinitialisées.", cls: "ok" }; render(); return; }
    if (a === "publish") { publish(); return; }
    if (a === "wb-panel") { ui.wbPanel = !ui.wbPanel; render(); return; }
    if (a === "wb-open") { var fi = document.getElementById("wbfile"); if (fi) fi.click(); return; }
    if (a === "wb-save") { if (ui.wb && ui.wb.hasOT) wbWrite(false); return; }
    if (a === "wb-new") { wbWrite(true); return; }
    if (a === "wb-close") { ui.wb = null; msg = { text: "Classeur fermé. Tes données restent dans ce navigateur.", cls: "ok" }; render(); return; }
  });
  app.addEventListener("change", function (e) { if (e.target.id === "navsel") location.hash = e.target.value; if (e.target.id === "wbfile") { wbOpenFile(e.target.files && e.target.files[0]); e.target.value = ""; } });

  function aiCR() {
    ui.cr = { loading: true }; refreshSum();
    window.claude.use("sample").then(function (sample) {
      if (!sample) throw { code: "not_granted" };
      var prompt = "Tu structures des notes de réunion d'un projet de déploiement PACS. Réponds uniquement par un objet JSON avec les clés : participants (texte), resume (2 à 3 phrases), decisions (liste de {texte}), actions (liste de {texte, responsable, echeance au format AAAA-MM-JJ ou chaîne vide}), points (liste de {texte}), risques (liste de {texte}), prochain (texte). Écris en français, phrases courtes. Date de la réunion : " + S.cr.date + ".\n\nNotes :\n" + S.cr.notes;
      return sample.json ? sample.json(prompt, { modelTier: "quick", cache: false }) : sample(prompt, { modelTier: "quick", cache: false }).then(function (r) { return JSON.parse(r.text.replace(/^[^{]*/, "").replace(/[^}]*$/, "")); });
    }).then(function (j) {
      var arr = function (x) { return Array.isArray(x) ? x.map(function (y) { return typeof y === "string" ? { texte: y } : { texte: y.texte || "", responsable: y.responsable || "", echeance: y.echeance || "" }; }) : []; };
      ui.cr = { participants: j.participants || "", resume: j.resume || "", decisions: arr(j.decisions), actions: arr(j.actions), points: arr(j.points), risques: arr(j.risques), discussion: [], prochain: j.prochain || "" };
      refreshSum();
    }).catch(function (err) {
      var c = err && err.code;
      ui.cr = { error: c === "not_granted" ? "Claude n'est pas disponible sur cette page. Utilise « Générer le compte rendu » avec les préfixes D:, A:, P:, R:." : c === "rate_limited" ? "Trop de demandes en peu de temps. Réessaie dans une minute." : "La structuration par Claude a échoué. Utilise « Générer le compte rendu »." };
      refreshSum();
    });
  }
  function publish() {
    var data = clone(S); data.meta.savedAt = new Date().toISOString();
    msg = { text: "Publication en cours…" }; render();
    window.claude.use("artifact").then(function (art) {
      if (!art) throw { code: "not_granted" };
      return art.publish({ "data/outils.json": { content: JSON.stringify(data), contentType: "application/json" } });
    }).then(function () { shared = data; S = clone(data); clearDraft(); msg = { text: "Publié : tous les lecteurs voient maintenant ces données.", cls: "ok" }; render(); })
      .catch(function (err) {
        var c = err && err.code;
        msg = { cls: c === "conflict" ? "" : "err", text: c === "conflict" ? "Une version plus récente a été publiée entre-temps ; la page se recharge avec elle. Tes saisies restent dans ce navigateur." : (c === "not_writer" || c === "not_granted" || c === "capability_disabled" || c === "not_declared") ? "Cette page est en lecture seule pour toi : tes saisies restent enregistrées dans ce navigateur uniquement." : "La publication a échoué. Réessaie dans un instant." };
        render();
      });
  }

  /* ================= démarrage ================= */
  function start(base) {
    shared = base;
    S = clone(base);
    ["stockage", "migration", "prerequis", "modalites", "aet", "flux", "recette", "bascule", "suivi", "formation", "cr", "avenant", "meta"].forEach(function (k) { if (!S[k]) S[k] = clone(DEFAULTS[k]); });
    if (!S.meta.situation) S.meta.situation = "2026-11-03";
    var st0 = S.stockage;
    if (st0.compressionArchive == null) { var dS = DEFAULTS.stockage; st0.compressionArchive = st0.compression || dS.compressionArchive; st0.copiesArchive = st0.copies || dS.copiesArchive; st0.horizon = st0.annees || dS.horizon; st0.cacheMois = dS.cacheMois; st0.compressionCache = dS.compressionCache; st0.copiesCache = dS.copiesCache; st0.conservation = dS.conservation; delete st0.compression; delete st0.copies; delete st0.annees; }
    if (S.aet.pacsAet == null) { S.aet.pacsAet = "PACS_SA"; S.aet.pacsIp = "10.20.0.10"; S.aet.pacsPort = 104; }
    var dr = loadDraft();
    if (dr && dr.data) {
      S = dr.data; dirty = true;
      if ((dr.basedOn || null) !== (base.meta.savedAt || null)) msg = { text: "Une version plus récente a été publiée depuis tes dernières saisies dans ce navigateur.", actions: [{ id: "keep", label: "Garder mes saisies" }, { id: "discard", label: "Charger la version publiée", primary: true }] };
    }
    route();
  }
  fetch("data/outils.json", { cache: "no-store" }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(start, function () { start(clone(DEFAULTS)); });
})();
</script>
